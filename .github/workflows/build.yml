name: Build Notelet

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:ui

  build-desktop:
    needs: frontend-check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-26-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libsecret-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri application
        run: npx tauri build

      - name: Run Rust clippy and unit tests
        if: runner.os == 'Linux'
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: notelet-${{ matrix.os }}
          path: |
            src-tauri/target/release/notelet.exe
            src-tauri/target/release/notelet
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
