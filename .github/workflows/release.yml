name: Release Notelet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-26-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libsecret-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build

      - name: Prepare normalized release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          rm -rf release_assets
          mkdir -p release_assets
          if [ "${{ runner.os }}" = "Linux" ]; then
            RAW_APPIMAGE="src-tauri/target/release/bundle/appimage/Notelet_${VERSION}_amd64.AppImage"
            OUT_APPIMAGE="release_assets/Notelet_${VERSION}_linux_x86_64.AppImage"
            chmod +x "$RAW_APPIMAGE"
            rm -rf /tmp/notelet-appdir
            (cd /tmp && "$OLDPWD/$RAW_APPIMAGE" --appimage-extract >/dev/null && mv squashfs-root notelet-appdir)
            mkdir -p /tmp/notelet-appdir/usr/share/applications \
              /tmp/notelet-appdir/usr/share/icons/hicolor/128x128/apps \
              /tmp/notelet-appdir/usr/share/icons/hicolor/256x256/apps \
              /tmp/notelet-appdir/usr/share/icons/hicolor/512x512/apps
            cp src-tauri/icons/128x128.png /tmp/notelet-appdir/usr/share/icons/hicolor/128x128/apps/notelet.png
            cp src-tauri/icons/128x128@2x.png /tmp/notelet-appdir/usr/share/icons/hicolor/256x256/apps/notelet.png
            cp src-tauri/icons/icon.png /tmp/notelet-appdir/usr/share/icons/hicolor/512x512/apps/notelet.png
            cp src-tauri/icons/128x128@2x.png /tmp/notelet-appdir/notelet.png
            cp src-tauri/icons/128x128@2x.png /tmp/notelet-appdir/.DirIcon
            cat > /tmp/notelet-appdir/notelet.desktop <<'EOF'
[Desktop Entry]
Type=Application
Name=Notelet
Comment=軽量なローカルファースト録音・文字起こし・Notion連携ノートアプリ
Exec=notelet
Icon=notelet
StartupWMClass=notelet
Categories=Office;AudioVideo;
Terminal=false
EOF
            cp /tmp/notelet-appdir/notelet.desktop /tmp/notelet-appdir/usr/share/applications/notelet.desktop
            chmod -R a+rX /tmp/notelet-appdir
            chmod +x /tmp/notelet-appdir/AppRun
            curl -fsSL -o /tmp/appimagetool \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x /tmp/appimagetool
            ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool --no-appstream \
              /tmp/notelet-appdir "$OUT_APPIMAGE"
            chmod +x "$OUT_APPIMAGE"
            rm -rf /tmp/verify-appdir
            (cd /tmp && "$OLDPWD/$OUT_APPIMAGE" --appimage-extract >/dev/null && mv squashfs-root verify-appdir)
            test -f /tmp/verify-appdir/.DirIcon
            grep -q "^StartupWMClass=notelet$" /tmp/verify-appdir/notelet.desktop
            grep -q "^Icon=notelet$" /tmp/verify-appdir/notelet.desktop
            cp "src-tauri/target/release/bundle/deb/Notelet_${VERSION}_amd64.deb" \
               "release_assets/Notelet_${VERSION}_linux_x86_64.deb"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp "src-tauri/target/release/bundle/nsis/Notelet_${VERSION}_x64-setup.exe" \
               "release_assets/Notelet_${VERSION}_windows_x64-setup.exe"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp "src-tauri/target/release/bundle/dmg/Notelet_${VERSION}_aarch64.dmg" \
               "release_assets/Notelet_${VERSION}_macos_aarch64.dmg"
          elif [ "${{ matrix.os }}" = "macos-26-intel" ]; then
            cp "src-tauri/target/release/bundle/dmg/Notelet_${VERSION}_x64.dmg" \
               "release_assets/Notelet_${VERSION}_macos_x64.dmg"
          fi
          ls -la release_assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release_assets/*
          generate_release_notes: true
