name: Release Notelet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-linux-x86:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux x86 dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev:i386 \
            libgtk-3-dev:i386 \
            librsvg2-dev:i386 \
            libasound2-dev:i386 \
            libssl-dev:i386 \
            libsecret-1-dev:i386 \
            gcc-multilib \
            g++-multilib \
            patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build x86 binary
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: npx tauri build --target i686-unknown-linux-gnu --no-bundle

      - name: Package x86 AppImage
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TARGET_DIR="src-tauri/target/i686-unknown-linux-gnu/release"
          APPDIR="$PWD/$TARGET_DIR/Notelet.AppDir"
          OUT_DIR="$PWD/$TARGET_DIR/bundle/appimage"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/128x128/apps" "$OUT_DIR"
          cp "$TARGET_DIR/notelet" "$APPDIR/usr/bin/notelet"
          cp src-tauri/icons/128x128.png "$APPDIR/Notelet.png"
          cp src-tauri/icons/128x128.png "$APPDIR/usr/share/icons/hicolor/128x128/apps/Notelet.png"
          cp "$APPDIR/Notelet.png" "$APPDIR/.DirIcon"
          cat > "$APPDIR/Notelet.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Notelet
          Comment=録音・文字起こし・ノート
          Exec=notelet
          Icon=Notelet
          Categories=Office;AudioVideo;
          Terminal=false
          EOF
          cp "$APPDIR/Notelet.desktop" "$APPDIR/usr/share/applications/Notelet.desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/notelet" "$@"
          EOF
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/notelet"
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o /tmp/runtime-i686 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-i686
          chmod +x /tmp/appimagetool /tmp/runtime-i686
          ARCH=i686 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool \
            --runtime-file /tmp/runtime-i686 --no-appstream \
            "$APPDIR" "$OUT_DIR/Notelet_${VERSION}_i386.AppImage"

      - name: Upload x86 AppImage to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/i686-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  publish-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-26-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libsecret-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx tauri build

      - name: Verify Linux x86_64 AppImage and deb bundles
        if: runner.os == 'Linux'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -f "src-tauri/target/release/bundle/appimage/Notelet_${VERSION}_amd64.AppImage" ]; then
            cp "src-tauri/target/release/bundle/appimage/Notelet_${VERSION}_amd64.AppImage" \
               "src-tauri/target/release/bundle/appimage/Notelet_${VERSION}_x86_64.AppImage"
          fi
          ls -la src-tauri/target/release/bundle/appimage/*.AppImage
          ls -la src-tauri/target/release/bundle/deb/*.deb

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/notelet.exe
            src-tauri/target/release/notelet
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
