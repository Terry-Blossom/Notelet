[package]
name = "koenote"
version = "0.15.7"
description = "軽量なローカルファースト録音・文字起こし・Notion連携ノートアプリ"
authors = ["KoeNote Contributors"]
edition = "2021"

[lib]
name = "koenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
dirs = "6"
